name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test CLI on sample org
        run: npm run analyze:sample
      - name: Smoke test gate, JUnit and evidence on sample org
        run: |
          FIELD=fixtures/sample-org/force-app/main/default/objects/Opportunity/fields/Contract_Signed_Date__c.field-meta.xml
          node dist/cli.js analyze --project fixtures/sample-org --files "$FIELD" --gate --fail-on none --format junit > "$RUNNER_TEMP/preflight.xml"
          grep -q '<testsuite name="sf-preflight.gate"' "$RUNNER_TEMP/preflight.xml"
          node dist/cli.js evidence --project fixtures/sample-org --files "$FIELD" --out "$RUNNER_TEMP/evidence.json"
          node dist/cli.js evidence --verify "$RUNNER_TEMP/evidence.json"
      - name: Smoke test agent explanations on sample org
        run: |
          node dist/cli.js agents --project fixtures/sample-org
          node dist/cli.js agents Sales_Agent --project fixtures/sample-org | grep -q "Close_Deals › Close Opportunity"
      - name: Smoke test test generation on sample org
        run: |
          node dist/cli.js tests --project fixtures/sample-org \
            --files fixtures/sample-org/force-app/main/default/objects/Opportunity/fields/Contract_Signed_Date__c.field-meta.xml \
            --out "$RUNNER_TEMP/preflight-tests"
          test -s "$RUNNER_TEMP/preflight-tests/classes/PreflightChangeTest.cls"
          test -s "$RUNNER_TEMP/preflight-tests/classes/PreflightDataFactory.cls"
      - name: Check the npm package contents
        run: npm pack --dry-run

  vscode:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode/package-lock.json
      # The extension bundles the library from ../src, so it needs the root dependencies too.
      - run: npm ci
      - run: npm ci
        working-directory: vscode
      - run: npm run typecheck
        working-directory: vscode
      - run: npm run build
        working-directory: vscode
      - name: Activate the extension against a sample project
        run: node --test test/extension.test.mjs
        working-directory: vscode
      - name: Package the extension
        run: npx vsce package --no-dependencies -o sf-preflight.vsix
        working-directory: vscode
      - name: Test the minified build that ships
        run: node --test test/extension.test.mjs
        working-directory: vscode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sf-preflight-vsix
          path: vscode/sf-preflight.vsix
          retention-days: 14

  action:
    name: Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run the action from source on the sample org
        id: preflight
        uses: ./
        with:
          version: local
          project: fixtures/sample-org
          # Empty tree: treat every file in the fixture as added.
          base: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fail-on: none
          comment: "false"
      - name: Check outputs
        env:
          RISK: ${{ steps.preflight.outputs.risk }}
          HIGH: ${{ steps.preflight.outputs.high }}
          GATE: ${{ steps.preflight.outputs.gate }}
          EVIDENCE: ${{ steps.preflight.outputs.evidence }}
          DIGEST: ${{ steps.preflight.outputs.evidence-digest }}
        run: |
          echo "risk=$RISK high=$HIGH gate=$GATE digest=$DIGEST"
          test "$RISK" = "high"
          test "$HIGH" -gt 0
          test "$GATE" = "pass"
          test -s "$EVIDENCE"
          test "${#DIGEST}" -eq 64
          node dist/cli.js evidence --verify "$EVIDENCE"
