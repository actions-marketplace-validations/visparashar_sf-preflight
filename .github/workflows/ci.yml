name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test CLI on sample org
        run: npm run analyze:sample
      - name: Smoke test agent explanations on sample org
        run: |
          node dist/cli.js agents --project fixtures/sample-org
          node dist/cli.js agents Sales_Agent --project fixtures/sample-org | grep -q "Close_Deals › Close Opportunity"
      - name: Smoke test test generation on sample org
        run: |
          node dist/cli.js tests --project fixtures/sample-org \
            --files fixtures/sample-org/force-app/main/default/objects/Opportunity/fields/Contract_Signed_Date__c.field-meta.xml \
            --out "$RUNNER_TEMP/preflight-tests"
          test -s "$RUNNER_TEMP/preflight-tests/classes/PreflightChangeTest.cls"
          test -s "$RUNNER_TEMP/preflight-tests/classes/PreflightDataFactory.cls"
      - name: Check the npm package contents
        run: npm pack --dry-run

  action:
    name: Action self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run the action from source on the sample org
        id: preflight
        uses: ./
        with:
          version: local
          project: fixtures/sample-org
          # Empty tree: treat every file in the fixture as added.
          base: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
          fail-on: none
          comment: "false"
      - name: Check outputs
        env:
          RISK: ${{ steps.preflight.outputs.risk }}
          HIGH: ${{ steps.preflight.outputs.high }}
        run: |
          echo "risk=$RISK high=$HIGH"
          test "$RISK" = "high"
          test "$HIGH" -gt 0
