name: Bug report
description: Something crashes, errors, or behaves incorrectly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For a finding that is wrong or missing,
        please use the **Wrong or missing finding** template instead.
        **Do not include confidential metadata or customer data.** Anonymise names where needed.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the full error message or unexpected output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The command you ran and, ideally, a minimal metadata snippet.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sf-preflight version
      placeholder: output of `preflight --version`
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: e.g. Node 22.12.0 on macOS 15
    validations:
      required: true
